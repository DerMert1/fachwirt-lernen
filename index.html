  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name:"PBKDF2", salt:u(D.s), iterations:D.n, hash:"SHA-256" }, base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name:"AES-GCM", iv:u(D.i) }, key, u(D.c)));
  try { localStorage.setItem("fw_pw", pw); } catch {}
  document.open(); document.write(html); document.close();
}
const f = document.getElementById("f");
f.onsubmit = async e => { e.preventDefault(); document.getElementById("err").textContent = "";
  try { await open_(document.getElementById("pw").value); } catch { document.getElementById("err").textContent = "Das Passwort stimmt nicht."; } };
(async () => { let pw = null; try { pw = localStorage.getItem("fw_pw"); } catch {}
  if (pw) { try { await open_(pw); return; } catch { try { localStorage.removeItem("fw_pw"); } catch {} } }
  f.hidden = false; document.getElementById("pw").focus(); })();
</script></body></html>
